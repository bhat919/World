<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Travel Booking Form</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{
    background:linear-gradient(135deg,#00BCD4,#2196F3);
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:20px;
}

.form-box{
    background:#fff;
    width:100%;
    max-width:500px;
    padding:30px;
    border-radius:15px;
    box-shadow:0 10px 20px rgba(0,0,0,.3);
}

h2{
    text-align:center;
    color:#0097A7;
    margin-bottom:20px;
}

input,
select,
textarea{
    width:100%;
    padding:12px;
    margin:10px 0;
    border:1px solid #ccc;
    border-radius:6px;
    font-size:16px;
}

textarea{
    resize:none;
}

button{
    width:100%;
    padding:15px;
    background:#00BCD4;
    color:#fff;
    border:none;
    border-radius:6px;
    font-size:18px;
    cursor:pointer;
}

button:hover{
    background:#0097A7;
}

.back{
    display:block;
    margin-top:20px;
    text-align:center;
    text-decoration:none;
    color:#0097A7;
    font-weight:bold;
}
</style>

</head>
<body>

<div class="form-box">

<h2>Travel Booking Form</h2>

<form id="bookingForm">

<input type="text" id="name" placeholder="Full Name" required>

<input type="email" id="email" placeholder="Email Address" required>

<input type="tel" id="phone" placeholder="Phone Number" required>

<select id="destination" required>
<option value="">Select Destination</option>
<option>Kashmir</option>
<option>Goa</option>
<option>Manali</option>
<option>Dubai</option>
<option>Maldives</option>
<option>Paris</option>
</select>

<input type="date" id="date" required>

<input type="number" id="travellers" placeholder="Number of Travellers" required>

<textarea id="request" rows="4" placeholder="Special Request"></textarea>

<button type="submit">Book on WhatsApp</button>

</form>

<a href="index.html" class="back">⬅ Back to Home</a>

</div>

<script>

document.getElementById("bookingForm").addEventListener("submit",function(e){

e.preventDefault();

let name=document.getElementById("name").value;
let email=document.getElementById("email").value;
let phone=document.getElementById("phone").value;
let destination=document.getElementById("destination").value;
let date=document.getElementById("date").value;
let travellers=document.getElementById("travellers").value;
let request=document.getElementById("request").value;

let message=
"🌍 *New Travel Booking*%0A%0A"+
"👤 Name: "+name+"%0A"+
"📧 Email: "+email+"%0A"+
"📱 Phone: "+phone+"%0A"+
"📍 Destination: "+destination+"%0A"+
"📅 Travel Date: "+date+"%0A"+
"👥 Travellers: "+travellers+"%0A"+
"📝 Special Request: "+request;

// Replace this with your own WhatsApp number
let whatsapp="917889401556";

window.open("https://wa.me/"+whatsapp+"?text="+message,"_blank");

});

</script>

</body>
</html>
